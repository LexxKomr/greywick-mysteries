<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16242c" />
    <title>Тайны Грейвика. Пасьянс-детектив</title>
    <style>
      html, body { margin: 0; height: 100%; background: #16242c; overflow: hidden; overscroll-behavior: none; }
      body { background-size: cover; background-position: center; touch-action: none; -webkit-user-select: none; user-select: none; }
      #shade { position: fixed; inset: 0; background: rgba(12, 20, 26, 0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      #game { position: fixed; inset: 0; }
      #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); box-sizing: border-box; display: grid; place-items: center; width: min(68vw, 330px); min-height: 56px; padding: 8px 18px; border: 2px solid #a87f48; border-radius: 19px; background: linear-gradient(90deg, #855532 var(--loaded, 0%), #202d33 var(--loaded, 0%)); color: #faf2dd; font: bold 20px/1.35 Georgia, serif; box-shadow: 0 3px 10px #0006; }
      #ad { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(8, 12, 16, 0.92); color: #f1e4c8; font: 28px Georgia, serif; text-align: center; padding: 24px; }
      #ad small { display: block; margin-top: 14px; font-size: 17px; opacity: 0.7; }
      .intro-film { position: fixed; z-index: 5; overflow: hidden; background: #10191e; }
      .comic-strip, .comic-shot { position: absolute; inset: 0; }
      .comic-shot { overflow: hidden; background: #10191e; animation: comic-fade .5s ease-out both; }
      .comic-shot img { width: 100%; height: 100%; object-fit: cover; animation: comic-zoom var(--duration) linear both; }
      .comic-shot p { position: absolute; left: 6%; right: 6%; bottom: 12%; box-sizing: border-box; margin: 0; padding: .75em 1em; color: #382418; background: #f5e7c7; border: 2px solid #a07a42; box-shadow: 0 4px 18px #0b111ac0; border-radius: 9px; font: 700 clamp(15px, 3vh, 27px)/1.28 "PT Serif", Georgia, serif; animation: comic-caption .35s .65s ease-out both; }
      .comic-shot[data-image="comic_albion_key"] p { top: 10%; bottom: auto; }
      @keyframes comic-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes comic-zoom { from { transform: scale(1); } to { transform: scale(1.07); } }
      @keyframes comic-caption { from { opacity: 0; transform: translateY(.4em); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .comic-shot, .comic-shot img, .comic-shot p { animation: none; } }
      .intro-film video { width: 100%; height: 100%; object-fit: contain; }
      .intro-film button { position: absolute; left: 50%; bottom: 2.5%; transform: translateX(-50%); min-width: 35%; padding: .56em 1.2em; border: 2px solid #c9a25a; border-radius: 7px; background: #16242cf0; box-shadow: 0 2px 6px #0008; color: #faf2dd; font: bold clamp(16px, 2.9vh, 26px) Georgia, serif; cursor: pointer; }
      .intro-film button:hover, .intro-film button:focus-visible { background: #7a1f2b; }
    </style>
  </head>
  <body>
    <div id="shade"></div>
    <div id="game"></div>
    <div id="loading" role="status">Загрузка…</div>
    <div id="ad"><div><span id="ad-text"></span><small id="ad-note"></small></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
