<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16242c" />
    <title>Тайны Грейвика. Пасьянс-детектив</title>
    <style>
      html, body { margin: 0; height: 100%; background: #16242c; overflow: hidden; overscroll-behavior: none; }
      body { background-size: cover; background-position: center; touch-action: none; -webkit-user-select: none; user-select: none; }
      #shade { position: fixed; inset: 0; background: rgba(12, 20, 26, 0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      #game { position: fixed; inset: 0; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #e9dcc0; font: 20px Georgia, serif; }
      #ad { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(8, 12, 16, 0.92); color: #f1e4c8; font: 28px Georgia, serif; text-align: center; padding: 24px; }
      #ad small { display: block; margin-top: 14px; font-size: 17px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="shade"></div>
    <div id="game"></div>
    <div id="loading">Загрузка…</div>
    <div id="ad"><div><span id="ad-text"></span><small id="ad-note"></small></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
